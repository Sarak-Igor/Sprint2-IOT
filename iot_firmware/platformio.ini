[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0.0

; Ambiente nativo (sem hardware/framework Arduino) para testar unitariamente a lib
; config_parser (lib/config_parser/), que não depende de WiFi/PubSubClient — só de
; ArduinoJson, portável para desktop. PlatformIO linka tudo em lib/ automaticamente,
; tanto no build normal (src/) quanto no build de teste (test/).
[env:native]
platform = native
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
